<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Emma Hall | Designer</title>

  <link
    rel="stylesheet"
    href="style.css?v=10"
  >
</head>

<body>

  <header class="site-header">

    <a
      class="identity"
      href="/"
      aria-label="Emma Hall homepage"
    >

      <span
        class="identity-mark"
        aria-hidden="true"
      ></span>

      <span class="identity-text">

        <strong>EMMA HALL</strong>

        <span>DESIGNER / LONDON</span>

      </span>

    </a>


    <nav
      class="site-navigation"
      aria-label="Main navigation"
    >

      <a href="#work">WORK</a>

      <a href="#about">ABOUT</a>

      <a href="#contact">CONTACT</a>

    </nav>

  </header>


  <main>

    <section
      class="featured-section"
      id="work"
    >

      <h1 class="section-title">
        Featured projects
      </h1>


      <div
        class="carousel"
        id="featured-carousel"
      >

        <div class="carousel-viewport">

          <div
            class="carousel-track"
            id="carousel-track"
          ></div>

        </div>

      </div>


      <div
        class="mobile-project-list"
        id="mobile-project-list"
      ></div>

    </section>

  </main>


  <script src="script.js?v=10"></script>

</body>

</html>
